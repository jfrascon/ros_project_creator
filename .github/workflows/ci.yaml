name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run repository checks
        # Branch protection belongs to local commit creation, not CI checking
        # an already-created commit on the default branch.
        run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade pip build && python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/ros-project-generator-package
          /tmp/ros-project-generator-package/bin/pip install dist/*.whl
      - name: Generate a project from the installed wheel
        run: |
          /tmp/ros-project-generator-package/bin/ros-project new \
            ci_smoke "${HOME}/ci-smoke" jazzy \
            --img-id ci-smoke:latest --no-pre-commit
          test -f "${HOME}/ci-smoke/docker/Dockerfile"
          test -f "${HOME}/ci-smoke/docker/compose_files/docker-compose.yaml"
          test -f "${HOME}/ci-smoke/.devcontainer/docker-compose.yaml"
          test -f "${HOME}/ci-smoke/README.md"
